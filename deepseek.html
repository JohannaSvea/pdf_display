<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Repo Document Browser</title>
    <style>
        :root {
            --bg: #f9f8f6;
            --surface: #ffffff;
            --surface-hover: #f3f1ed;
            --border: #e7e3dc;
            --text: #2c2a27;
            --text-secondary: #6b6560;
            --accent: #4a7c96;
            --accent-light: #e8f0f5;
            --pdf-color: #c75b4a;
            --pdf-bg: #fef5f3;
            --yt-color: #c4302b;
            --yt-bg: #fff5f5;
            --folder-color: #d4a853;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 18px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle background texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(180, 160, 130, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 75% 60%, rgba(140, 160, 180, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 85%, rgba(160, 140, 120, 0.03) 0%, transparent 50%);
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* ── Header ─────────────────────── */
        .header {
            text-align: center;
            padding: 36px 24px 28px;
            margin-bottom: 20px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            translate: -50% 0;
            width: 120px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--folder-color), var(--accent), var(--pdf-color));
            opacity: 0.7;
        }
        .header .repo-icon {
            font-size: 48px;
            margin-bottom: 6px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            margin: 0 0 4px;
            word-break: break-word;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .header .repo-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--accent-light);
        }
        .header .repo-link:hover {
            background: #d4e4f0;
            color: #365d73;
        }

        /* ── Breadcrumbs ────────────────── */
        .breadcrumbs {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            min-height: 42px;
        }
        .breadcrumbs .crumb {
            cursor: pointer;
            color: var(--accent);
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            transition: var(--transition);
            white-space: nowrap;
            user-select: none;
        }
        .breadcrumbs .crumb:hover {
            background: var(--accent-light);
            color: #365d73;
        }
        .breadcrumbs .crumb.root {
            font-weight: 600;
        }
        .breadcrumbs .sep {
            color: #c5bfb6;
            pointer-events: none;
            user-select: none;
            font-size: 0.75rem;
        }
        .breadcrumbs .crumb.current {
            color: var(--text);
            font-weight: 600;
            pointer-events: none;
            cursor: default;
        }

        /* ── Tree Container ─────────────── */
        .tree {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .tree-inner {
            padding: 8px 0;
        }

        /* ── Tree Items ────────────────── */
        .tree-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            margin: 1px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            gap: 10px;
            min-height: 46px;
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tree-item:hover {
            background: var(--surface-hover);
        }
        .tree-item:active {
            scale: 0.995;
        }
        .tree-item .icon {
            font-size: 1.3rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
            transition: var(--transition);
        }
        .tree-item .name {
            flex: 1;
            font-weight: 500;
            font-size: 0.93rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .tree-item .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            white-space: nowrap;
        }
        .tree-item .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .tree-item .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            background: transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .tree-item .action-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            color: var(--text);
        }
        .tree-item .action-btn.preview-btn:hover {
            background: var(--pdf-bg);
            color: var(--pdf-color);
        }
        .tree-item .action-btn.open-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
        }
        .tree-item .action-btn.yt-btn:hover {
            background: var(--yt-bg);
            color: var(--yt-color);
        }

        /* ── Folder-specific ────────────── */
        .tree-item.folder-item {
            font-weight: 600;
        }
        .tree-item.folder-item .chevron {
            font-size: 0.7rem;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-secondary);
            flex-shrink: 0;
            width: 16px;
            text-align: center;
        }
        .tree-item.folder-item.expanded .chevron {
            transform: rotate(90deg);
        }
        .tree-item.folder-item .icon {
            color: var(--folder-color);
        }

        /* ── PDF item ──────────────────── */
        .tree-item.pdf-item .icon {
            color: var(--pdf-color);
        }
        .tree-item.pdf-item {
            border-left: 3px solid transparent;
            margin-left: 12px;
            padding-left: 13px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        .tree-item.pdf-item:hover {
            border-left-color: var(--pdf-color);
            background: var(--pdf-bg);
        }

        /* ── YouTube link item ─────────── */
        .tree-item.yt-item .icon {
            color: var(--yt-color);
        }
        .tree-item.yt-item {
            border-left: 3px solid transparent;
            margin-left: 12px;
            padding-left: 13px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        .tree-item.yt-item:hover {
            border-left-color: var(--yt-color);
            background: var(--yt-bg);
        }
        .tree-item.yt-item .name {
            color: #5c1a18;
        }

        /* ── Children container ────────── */
        .children {
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
            max-height: 0;
            opacity: 0;
        }
        .children.open {
            max-height: 4000px;
            opacity: 1;
        }
        .children-inner {
            padding: 2px 0 6px 0;
            border-left: 2px solid #ece7de;
            margin-left: 28px;
            position: relative;
        }
        .children-inner::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 0;
            bottom: 20px;
            width: 2px;
            background: linear-gradient(to bottom, #d9d2c5 0%, transparent 100%);
            border-radius: 1px;
            pointer-events: none;
        }

        /* ── Loading ───────────────────── */
        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }
        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Empty state ───────────────── */
        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .empty-state .empty-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.6;
        }

        /* ── Error banner ──────────────── */
        .error-banner {
            background: #fff0ef;
            border: 1px solid #f5c6c0;
            color: #8b3c34;
            padding: 14px 18px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-banner .error-icon {
            font-size: 1.3rem;
        }

        /* ── Preview Modal ─────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 900px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-header .modal-title {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            margin-right: 12px;
        }
        .modal-header .modal-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .modal-header button {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font);
        }
        .modal-header button:hover {
            background: var(--surface-hover);
        }
        .modal-header button.close-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
        }
        .modal-header button.close-btn:hover {
            background: #f0ece7;
            color: var(--text);
        }
        .modal-body {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }
        .modal-body iframe {
            width: 100%;
            height: 100%;
            min-height: 65vh;
            border: none;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        /* ── Responsive ────────────────── */
        @media (max-width: 600px) {
            .app {
                padding: 12px 8px 40px;
            }
            .header {
                padding: 24px 16px 20px;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .tree-item {
                padding: 8px 10px;
                gap: 6px;
                margin: 1px 4px;
                min-height: 40px;
            }
            .tree-item .name {
                font-size: 0.85rem;
            }
            .tree-item .icon {
                font-size: 1.1rem;
                width: 22px;
            }
            .children-inner {
                margin-left: 18px;
            }
            .tree-item.pdf-item,
            .tree-item.yt-item {
                margin-left: 6px;
                padding-left: 10px;
            }
            .modal {
                max-height: 95vh;
                border-radius: var(--radius);
            }
            .modal-body iframe {
                min-height: 50vh;
            }
        }

        @media (max-width: 380px) {
            .tree-item .actions {
                gap: 2px;
            }
            .tree-item .action-btn {
                width: 28px;
                height: 28px;
                font-size: 0.85rem;
            }
            .breadcrumbs {
                font-size: 0.75rem;
                padding: 8px 10px;
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <span class="repo-icon">📚</span>
            <h1 id="repoTitle">Repository Document Browser</h1>
            <p class="subtitle">Browse folders, preview PDFs, and watch linked videos</p>
            <a id="repoLink" class="repo-link" href="#" target="_blank" rel="noopener">View on GitHub ↗</a>
        </header>

        <!-- Error banner (hidden by default) -->
        <div id="errorBanner" class="error-banner" style="display:none;">
            <span class="error-icon">⚠️</span>
            <span id="errorMessage"></span>
        </div>

        <!-- Breadcrumbs -->
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb navigation">
            <span class="crumb root" data-path="">📁 Root</span>
        </nav>

        <!-- Tree -->
        <div class="tree">
            <div class="tree-inner" id="treeRoot">
                <div class="loading-indicator">
                    <div class="loading-spinner"></div>
                    Loading repository contents…
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal-overlay" style="display:none;" aria-hidden="true">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">PDF Preview</span>
                <div class="modal-actions">
                    <button id="modalOpenBtn" title="Open in new tab">↗ Open</button>
                    <button class="close-btn" id="modalCloseBtn" title="Close preview">✕</button>
                </div>
            </div>
            <div class="modal-body">
                <iframe id="modalIframe" src="" title="PDF Preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ─────────────────────────────────────
            // Configuration & State
            // ─────────────────────────────────────
            const CACHE = new Map(); // path -> { contents, links }
            const LINKS_FILENAME = '_links.json';
            let currentRepoOwner = '';
            let currentRepoName = '';
            let repoHtmlUrl = '';

            // ─────────────────────────────────────
            // DOM References
            // ─────────────────────────────────────
            const treeRoot = document.getElementById('treeRoot');
            const breadcrumbsEl = document.getElementById('breadcrumbs');
            const repoTitleEl = document.getElementById('repoTitle');
            const repoLinkEl = document.getElementById('repoLink');
            const errorBanner = document.getElementById('errorBanner');
            const errorMessage = document.getElementById('errorMessage');
            const previewModal = document.getElementById('previewModal');
            const modalIframe = document.getElementById('modalIframe');
            const modalTitle = document.getElementById('modalTitle');
            const modalOpenBtn = document.getElementById('modalOpenBtn');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            // ─────────────────────────────────────
            // Repo Detection
            // ─────────────────────────────────────
            function detectRepo() {
                const url = new URL(window.location.href);
                const params = new URLSearchParams(url.search);

                // Allow manual override via ?repo=owner/name
                if (params.has('repo')) {
                    const [owner, name] = params.get('repo').split('/');
                    if (owner && name) {
                        currentRepoOwner = owner.trim();
                        currentRepoName = name.trim();
                        repoHtmlUrl = `https://github.com/${currentRepoOwner}/${currentRepoName}`;
                        return true;
                    }
                }

                // Auto-detect from GitHub Pages URL: https://owner.github.io/repo/
                const hostname = url.hostname;
                if (hostname.endsWith('.github.io')) {
                    const owner = hostname.replace('.github.io', '');
                    const pathParts = url.pathname.split('/').filter(Boolean);
                    const repo = pathParts[0] || '';
                    if (owner && repo && owner !== 'github') {
                        currentRepoOwner = owner;
                        currentRepoName = repo;
                        repoHtmlUrl = `https://github.com/${currentRepoOwner}/${currentRepoName}`;
                        return true;
                    }
                }

                // Fallback: try to detect from path if served via raw GitHub or custom domain
                // Check if we can find owner/repo pattern in the path
                const pathParts = url.pathname.split('/').filter(Boolean);
                if (pathParts.length >= 2) {
                    // Could be a custom domain pointing to a repo page
                    // This is a best-effort guess
                    currentRepoOwner = pathParts[0];
                    currentRepoName = pathParts[1];
                    repoHtmlUrl = `https://github.com/${currentRepoOwner}/${currentRepoName}`;
                    return true;
                }

                return false;
            }

            // ─────────────────────────────────────
            // GitHub API Helpers
            // ─────────────────────────────────────
            function apiUrl(path) {
                const cleanPath = path ? `/${path}` : '';
                return `https://api.github.com/repos/${currentRepoOwner}/${currentRepoName}/contents${cleanPath}`;
            }

            async function fetchContents(path) {
                if (CACHE.has(path)) {
                    return CACHE.get(path);
                }
                const response = await fetch(apiUrl(path));
                if (!response.ok) {
                    if (response.status === 403 && response.headers.get('X-RateLimit-Remaining') === '0') {
                        throw new Error(
                            'GitHub API rate limit exceeded (60 requests/hour for unauthenticated access). Please wait and try again later.'
                            );
                    }
                    if (response.status === 404) {
                        throw new Error(`Path not found: "${path || 'root'}" — the repository or folder may not exist.`);
                    }
                    throw new Error(
                        `GitHub API error: ${response.status} ${response.statusText}. The repository might be private or inaccessible.`
                        );
                }
                const data = await response.json();

                // Separate _links.json from other files
                let links = [];
                const contents = [];
                if (Array.isArray(data)) {
                    for (const item of data) {
                        if (item.type === 'file' && item.name === LINKS_FILENAME) {
                            // Fetch the _links.json content
                            try {
                                const linksData = await fetchLinksJson(item.download_url);
                                links = linksData;
                            } catch (e) {
                                console.warn(`Could not parse ${LINKS_FILENAME} in "${path || 'root'}":`, e.message);
                                links = [];
                            }
                        } else {
                            contents.push(item);
                        }
                    }
                }

                // Sort: folders first, then files, both alphabetically
                contents.sort((a, b) => {
                    if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
                    return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
                });

                const result = { contents, links };
                CACHE.set(path, result);
                return result;
            }

            async function fetchLinksJson(downloadUrl) {
                const response = await fetch(downloadUrl);
                if (!response.ok) throw new Error('Failed to fetch links JSON');
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Links JSON is not an array');
                // Validate and clean entries
                return data
                    .filter(entry => entry && typeof entry.url === 'string' && entry.url.trim().length > 0)
                    .map(entry => ({
                        title: (entry.title || entry.name || 'YouTube Link').toString().trim(),
                        url: entry.url.trim(),
                        description: entry.description || '',
                    }));
            }

            // ─────────────────────────────────────
            // Rendering
            // ─────────────────────────────────────
            function showError(msg) {
                errorMessage.textContent = msg;
                errorBanner.style.display = 'flex';
            }

            function hideError() {
                errorBanner.style.display = 'none';
            }

            function renderBreadcrumbs(pathParts) {
                // Build breadcrumb from path parts
                let html = '<span class="crumb root" data-path="">📁 Root</span>';
                let accumulated = '';
                pathParts.forEach((part, index) => {
                    accumulated += (accumulated ? '/' : '') + part;
                    const isLast = index === pathParts.length - 1;
                    html += '<span class="sep">›</span>';
                    html +=
                        `<span class="crumb${isLast ? ' current' : ''}" data-path="${escapeHtmlAttr(accumulated)}">${escapeHtml(part)}</span>`;
                });
                breadcrumbsEl.innerHTML = html;

                // Attach click handlers
                breadcrumbsEl.querySelectorAll('.crumb:not(.current)').forEach(crumb => {
                    crumb.addEventListener('click', () => {
                        const targetPath = crumb.getAttribute('data-path') || '';
                        navigateTo(targetPath);
                    });
                });
            }

            function navigateTo(path) {
                hideError();
                const pathParts = path ? path.split('/').filter(Boolean) : [];
                renderBreadcrumbs(pathParts);
                renderTreeForPath(path, treeRoot);
            }

            async function renderTreeForPath(path, container) {
                container.innerHTML =
                    '<div class="loading-indicator"><div class="loading-spinner"></div>Loading…</div>';

                try {
                    const { contents, links } = await fetchContents(path);
                    renderContents(contents, links, container, path);
                } catch (err) {
                    container.innerHTML = `
                    <div class="empty-state">
                      <span class="empty-icon">⚠️</span>
                      <p>${escapeHtml(err.message)}</p>
                      <button onclick="location.reload()" style="margin-top:12px;padding:8px 18px;border-radius:20px;border:1px solid #ccc;cursor:pointer;background:#fff;font-family:inherit;">🔄 Retry</button>
                    </div>`;
                    showError(err.message);
                }
            }

            function renderContents(contents, links, container, currentPath) {
                if (contents.length === 0 && links.length === 0) {
                    container.innerHTML = `
                    <div class="empty-state">
                      <span class="empty-icon">📭</span>
                      <p>This folder is empty</p>
                    </div>`;
                    return;
                }

                const fragment = document.createDocumentFragment();
                const wrapper = document.createElement('div');
                wrapper.className = 'tree-inner';
                wrapper.style.padding = '4px 0';

                // Render folders
                contents.filter(item => item.type === 'dir').forEach(folder => {
                    const folderPath = currentPath ? `${currentPath}/${folder.name}` : folder.name;
                    const itemEl = createFolderItem(folder.name, folderPath);
                    wrapper.appendChild(itemEl);
                });

                // Render PDF files
                contents.filter(item => item.type === 'file' && isPdf(item.name)).forEach(file => {
                    const itemEl = createPdfItem(file.name, file.download_url);
                    wrapper.appendChild(itemEl);
                });

                // Render other files (non-PDF, non-_links.json)
                contents.filter(item => item.type === 'file' && !isPdf(item.name) && item.name !==
                    LINKS_FILENAME).forEach(file => {
                    const itemEl = createGenericFileItem(file.name, file.download_url);
                    wrapper.appendChild(itemEl);
                });

                // Render YouTube links from _links.json
                links.forEach((link, index) => {
                    const itemEl = createYoutubeLinkItem(link, index);
                    wrapper.appendChild(itemEl);
                });

                // If nothing rendered at all
                if (wrapper.children.length === 0) {
                    wrapper.innerHTML = `
                    <div class="empty-state">
                      <span class="empty-icon">📭</span>
                      <p>No viewable content in this folder</p>
                    </div>`;
                }

                fragment.appendChild(wrapper);
                container.innerHTML = '';
                container.appendChild(fragment);
            }

            function createFolderItem(name, folderPath) {
                const div = document.createElement('div');
                div.className = 'tree-item folder-item';
                div.setAttribute('data-folder-path', folderPath);
                div.innerHTML = `
                  <span class="chevron">▸</span>
                  <span class="icon">📁</span>
                  <span class="name">${escapeHtml(name)}</span>
                  <span class="meta">folder</span>
                `;
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFolder(div, folderPath);
                });
                return div;
            }

            function createPdfItem(name, downloadUrl) {
                const div = document.createElement('div');
                div.className = 'tree-item pdf-item';
                div.innerHTML = `
                  <span class="icon">📄</span>
                  <span class="name" title="${escapeHtmlAttr(name)}">${escapeHtml(name)}</span>
                  <span class="actions">
                    <button class="action-btn preview-btn" title="Preview PDF" aria-label="Preview ${escapeHtmlAttr(name)}">👁</button>
                    <button class="action-btn open-btn" title="Open in new tab" aria-label="Open ${escapeHtmlAttr(name)} in new tab">↗</button>
                  </span>
                `;

                // Click on name -> open in new tab
                const nameEl = div.querySelector('.name');
                nameEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(downloadUrl, '_blank', 'noopener,noreferrer');
                });

                // Preview button
                const previewBtn = div.querySelector('.preview-btn');
                previewBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openPreview(downloadUrl, name);
                });

                // Open button
                const openBtn = div.querySelector('.open-btn');
                openBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(downloadUrl, '_blank', 'noopener,noreferrer');
                });

                return div;
            }

            function createGenericFileItem(name, downloadUrl) {
                const div = document.createElement('div');
                div.className = 'tree-item';
                div.style.borderLeft = '3px solid transparent';
                div.style.marginLeft = '12px';
                div.style.paddingLeft = '13px';
                div.style.borderRadius = '0 var(--radius-sm) var(--radius-sm) 0';
                div.style.opacity = '0.75';
                div.innerHTML = `
                  <span class="icon">📎</span>
                  <span class="name" title="${escapeHtmlAttr(name)}">${escapeHtml(name)}</span>
                  <span class="actions">
                    <button class="action-btn open-btn" title="Open in new tab" aria-label="Open ${escapeHtmlAttr(name)}">↗</button>
                  </span>
                `;

                const nameEl = div.querySelector('.name');
                nameEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(downloadUrl, '_blank', 'noopener,noreferrer');
                });

                const openBtn = div.querySelector('.open-btn');
                openBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(downloadUrl, '_blank', 'noopener,noreferrer');
                });

                return div;
            }

            function createYoutubeLinkItem(link, index) {
                const div = document.createElement('div');
                div.className = 'tree-item yt-item';
                div.innerHTML = `
                  <span class="icon">🎬</span>
                  <span class="name" title="${escapeHtmlAttr(link.description || link.title)}">${escapeHtml(link.title)}</span>
                  <span class="actions">
                    <button class="action-btn yt-btn" title="Watch on YouTube" aria-label="Watch ${escapeHtmlAttr(link.title)} on YouTube">▶</button>
                  </span>
                `;

                const nameEl = div.querySelector('.name');
                nameEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(link.url, '_blank', 'noopener,noreferrer');
                });

                const ytBtn = div.querySelector('.yt-btn');
                ytBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(link.url, '_blank', 'noopener,noreferrer');
                });

                return div;
            }

            async function toggleFolder(folderElement, folderPath) {
                const isExpanded = folderElement.classList.contains('expanded');

                if (isExpanded) {
                    // Collapse
                    folderElement.classList.remove('expanded');
                    folderElement.querySelector('.icon').textContent = '📁';
                    const existingChildren = folderElement.nextElementSibling;
                    if (existingChildren && existingChildren.classList.contains('children')) {
                        existingChildren.classList.remove('open');
                        // Remove after animation
                        setTimeout(() => {
                            if (existingChildren.parentNode && !existingChildren.classList.contains(
                                    'open')) {
                                existingChildren.remove();
                            }
                        }, 350);
                    }
                } else {
                    // Expand
                    folderElement.classList.add('expanded');
                    folderElement.querySelector('.icon').textContent = '📂';

                    // Check if children container already exists
                    let childrenContainer = folderElement.nextElementSibling;
                    if (!childrenContainer || !childrenContainer.classList.contains('children')) {
                        childrenContainer = document.createElement('div');
                        childrenContainer.className = 'children';
                        const inner = document.createElement('div');
                        inner.className = 'children-inner';
                        inner.innerHTML =
                            '<div class="loading-indicator"><div class="loading-spinner"></div>Loading…</div>';
                        childrenContainer.appendChild(inner);
                        folderElement.insertAdjacentElement('afterend', childrenContainer);
                    }

                    const inner = childrenContainer.querySelector('.children-inner');
                    childrenContainer.classList.add('open');

                    // Fetch and render
                    try {
                        const { contents, links } = await fetchContents(folderPath);
                        renderContents(contents, links, inner, folderPath);
                    } catch (err) {
                        inner.innerHTML = `
                        <div class="empty-state">
                          <span class="empty-icon">⚠️</span>
                          <p>${escapeHtml(err.message)}</p>
                        </div>`;
                    }
                }
            }

            // ─────────────────────────────────────
            // Preview Modal
            // ─────────────────────────────────────
            function openPreview(pdfUrl, pdfName) {
                modalTitle.textContent = pdfName;
                modalIframe.src = pdfUrl;
                modalOpenBtn.onclick = () => window.open(pdfUrl, '_blank', 'noopener,noreferrer');
                previewModal.style.display = 'flex';
                previewModal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closePreview() {
                previewModal.style.display = 'none';
                previewModal.setAttribute('aria-hidden', 'true');
                modalIframe.src = '';
                document.body.style.overflow = '';
            }

            modalCloseBtn.addEventListener('click', closePreview);
            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal) closePreview();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && previewModal.style.display === 'flex') {
                    closePreview();
                }
            });

            // ─────────────────────────────────────
            // Utility Functions
            // ─────────────────────────────────────
            function isPdf(filename) {
                return /\.pdf$/i.test(filename);
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function escapeHtmlAttr(str) {
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            // ─────────────────────────────────────
            // Initialization
            // ─────────────────────────────────────
            function init() {
                const detected = detectRepo();

                if (!detected) {
                    treeRoot.innerHTML = `
                    <div class="empty-state">
                      <span class="empty-icon">🔍</span>
                      <p><strong>Could not auto-detect the repository.</strong></p>
                      <p style="margin-top:6px;">If you're running this locally, add <code>?repo=owner/repo-name</code> to the URL.</p>
                      <p style="font-size:0.8rem;color:#999;">Example: <code>index.html?repo=myuser/my-docs-repo</code></p>
                    </div>`;
                    repoTitleEl.textContent = 'Repository Document Browser';
                    repoLinkEl.style.display = 'none';
                    return;
                }

                repoTitleEl.textContent = currentRepoName;
                repoLinkEl.href = repoHtmlUrl;
                repoLinkEl.style.display = 'inline-block';
                document.title = `📚 ${currentRepoName} — Doc Browser`;

                // Initial render
                renderBreadcrumbs([]);
                renderTreeForPath('', treeRoot);
            }

            init();
        })();
    </script>
</body>
</html>
